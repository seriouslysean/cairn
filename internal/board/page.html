<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<meta name="color-scheme" content="light dark">
<title>Cairn board: {{.Tracker}}</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --text: #1c2025;
  --muted: #5d6874;
  --line: #d8dde3;
  --chip: #e8eef0;
  --chip-text: #25444d;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a;
    --surface: #1c2125;
    --text: #e4e8ec;
    --muted: #97a3af;
    --line: #2d353c;
    --chip: #263338;
    --chip-text: #b4d3dc;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header { padding: 16px 16px 4px; }
h1 { margin: 0; font-size: 1.25rem; }
.meta { margin: 4px 0 0; color: var(--muted); }
.board {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 12px 16px 24px;
}
.column {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
}
summary {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 12px;
  font-weight: 600;
  cursor: pointer;
}
.column[open] > summary { border-bottom: 1px solid var(--line); }
.status::before { content: "\25B8\00a0"; color: var(--muted); }
.column[open] .status::before { content: "\25BE\00a0"; }
.count { color: var(--muted); font-weight: 400; }
ul { margin: 0; padding: 0; list-style: none; }
.cards { padding: 8px; display: grid; gap: 8px; }
.card {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
}
.title { margin: 0; overflow-wrap: anywhere; }
.line {
  margin: 2px 0 0;
  display: flex;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}
.id { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  padding: 0 6px;
  border-radius: 4px;
  background: var(--chip);
  color: var(--chip-text);
  font-size: 12px;
  overflow-wrap: anywhere;
}
@media (min-width: 60rem) {
  .board { flex-direction: row; align-items: flex-start; overflow-x: auto; }
  .column { flex: 0 0 21rem; }
  .column:not([open]) { flex: 0 0 auto; }
}
</style>
</head>
<body>
<header>
<h1>{{.Tracker}}</h1>
<p class="meta">{{.Total}} issues, read-only snapshot from {{.Generated}}</p>
</header>
<main class="board">
{{range .Columns -}}
<details class="column" data-status="{{.Status}}"{{if .Open}} open{{end}}>
<summary><span class="status">{{.Status}}</span><span class="count">{{.Count}}</span></summary>
<ul class="cards">
{{range .Cards -}}
<li class="card">
<p class="title">{{.Title}}</p>
<p class="line"><span class="id">{{.ID}}</span><time datetime="{{.Updated}}" title="{{.Detailed}}">{{.Day}}</time></p>
{{if .Tags}}<ul class="tags">{{range .Tags}}<li class="tag">{{.}}</li>{{end}}</ul>
{{end -}}
</li>
{{end -}}
</ul>
</details>
{{end -}}
</main>
</body>
</html>
