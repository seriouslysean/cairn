name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: ./scripts/check.sh

  # go.mod allows Go 1.24, so the tests must pass there too. check.sh needs 1.26 or later for go fix -diff.
  oldest-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./... && go test ./...

  # Squash-merges a Dependabot PR once the jobs above pass, if every update is a
  # patch or minor (fastify/github-action-merge-dependabot, pinned to v3.15.0).
  # Majors and anything not Dependabot's stay open for a person.
  automerge:
    name: 'Dependabot auto-merge'
    needs: [check, oldest-go]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Merge minor and patch updates'
        uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          target: minor
          merge-method: squash
